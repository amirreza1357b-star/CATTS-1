<!-- Fix: override/deleteGoal handler to ensure deletion persists in localStorage -->
<script>
(function(){
  const GOAL_KEYS = ['catts_goals','goals','goalsData','goals_list','goals_v1'];

  function findKey(){
    for(const k of GOAL_KEYS){
      try{ if(localStorage.getItem(k)) return k; } catch(e){}
    }
    return null;
  }

  function getGoals(){
    const k = findKey();
    if(!k) return [];
    try{ return JSON.parse(localStorage.getItem(k)) || []; } catch(e){ return []; }
  }

  function setGoals(arr){
    const k = findKey() || GOAL_KEYS[0];
    try{ localStorage.setItem(k, JSON.stringify(arr)); } catch(e){}
  }

  // Override or provide a global deleteGoal function that updates storage + UI
  window.deleteGoal = function(id){
    try{
      const arr = getGoals();
      if(arr && arr.length){
        const filtered = arr.filter(g => String(g.id) !== String(id) && String((g && g.title) || '') !== String(id));
        setGoals(filtered);
      }
    } catch(e){ console.error('deleteGoal storage error', e); }

    // Remove DOM elements that represent the goal
    try{
      // elements with data-id attribute
      document.querySelectorAll(`[data-id="${id}"]`).forEach(el => el.remove());

      // buttons with onclick containing the id
      document.querySelectorAll('.delete-btn').forEach(btn => {
        const on = btn.getAttribute('onclick') || '';
        if(on.indexOf(String(id)) !== -1){
          const card = btn.closest('.goal-subject-card') || btn.closest('.goal-manager-item') || btn.parentElement;
          if(card) card.remove();
        }
      });

      // If there is a renderGoals function provided elsewhere, call it to refresh UI
      if(typeof window.renderGoals === 'function'){
        try{ window.renderGoals(); } catch(e){ console.warn('renderGoals threw', e); }
      }
    } catch(e){ console.error('deleteGoal DOM error', e); }
  };

  // Intercept clicks on delete buttons to ensure our deleteGoal runs (prevents double-behavior)
  document.addEventListener('click', function(e){
    const btn = e.target.closest && e.target.closest('.delete-btn');
    if(!btn) return;

    // try to get id from various places
    let id = btn.getAttribute('data-id') || btn.getAttribute('data-goal-id');
    if(!id){
      const on = btn.getAttribute('onclick') || '';
      const m = on.match(/deleteGoal\(['\"]([^'\"]+)['\"]\)/);
      if(m) id = m[1];
    }
    if(!id){
      const card = btn.closest('[data-id]');
      if(card) id = card.getAttribute('data-id');
    }

    if(id){
      e.preventDefault();
      window.deleteGoal(id);
    }
  }, true);

  // On load, if there is a renderGoals function defined elsewhere, call it
  document.addEventListener('DOMContentLoaded', function(){
    if(typeof window.renderGoals === 'function'){
      try{ window.renderGoals(); } catch(e){}
    }
  });
})();
</script>
